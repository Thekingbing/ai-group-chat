<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>ching</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/avatar/ching.svg"></head>
<body data-sitekey="__SITEKEY__">
<div id="login" class="hidden"><h1>🍓 ching 小窝</h1><p>私人聊天室 · 请输入邀请码</p><input id="code" maxlength="24" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX"><div id="ts"></div><button id="loginBtn">进入</button><div id="loginErr"></div></div>
<div id="remember" class="hidden"><h2>登录成功 🎉</h2><p>在这台设备上保持登录多久？</p><button data-d="0" class="ghost">不保存（关掉浏览器就退出）</button><button data-d="7">7 天</button><button data-d="15">15 天</button><button data-d="30">30 天</button><p class="tip">公用设备请选"不保存"。被踢出或换码后会立即失效。</p></div>
<div id="app" class="hidden"><header><span id="status"></span><img id="meAv" width="30" height="30" alt=""><span class="title" id="meName"></span><span class="q" id="quota"></span><button class="ghost hidden" id="adminBtn">管理</button><button class="ghost" id="logoutBtn">退出</button></header>
<div id="rooms"></div><div id="online"></div><div id="chingChip" class="hidden">🟢 ching 在线陪聊中</div><div id="grokChip" class="hidden">🟢 grok 在线中</div><div id="cueChip" class="hidden">🟢 cue 在线中</div><div id="msgs"></div><div id="typing"></div><div id="replyBar" class="hidden"><span id="replyTxt"></span><button class="ghost" id="replyX">✕</button></div>
<div id="emoPop" class="hidden"></div><div id="mentionPop" class="hidden" role="listbox" aria-label="提及"></div><div id="hallNote" class="hidden">📢 这里是公告区，聊天请去其他房间</div><footer><button id="imgBtn" title="发送图片">🖼️</button><button id="emoBtn" title="表情">😊</button><input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp" class="hidden"><textarea id="text" maxlength="1000" placeholder="说点什么… @ching 召唤她"></textarea><button id="sendBtn">发送</button></footer></div>
<div id="backdrop" class="hidden"></div><div id="adminPanel" class="hidden" role="dialog" aria-modal="true"></div><div id="editBox" class="hidden"><b>修改公告</b><textarea id="editTxt" maxlength="1000"></textarea><div class="eb"><button class="ghost" id="editCancel">取消</button><button id="editSave">保存</button></div></div><div id="viewer" class="hidden"><img id="viewerImg" alt=""></div><div id="toast" class="hidden"></div>
<script src="/app.js"></script></body></html>
